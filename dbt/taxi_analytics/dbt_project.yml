name: 'taxi_analytics'
version: '1.0.0'
config-version: 2

profile: 'taxi_analytics'

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  taxi_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

seeds:
  taxi_analytics:
    +schema: seeds
    taxi_zone_lookup:
      +column_types:
        LocationID: integer
