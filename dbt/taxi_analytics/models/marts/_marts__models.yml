version: 2

models:
  - name: dim_zone
    description: TLC taxi zone lookup (borough/zone/service_zone), seeded from the official TLC CSV.
    columns:
      - name: location_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Date spine for 2025.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fact_trips
    description: >
      Grain: one row per trip. Incremental on pickup_datetime. Includes both
      valid and flagged trips — filter on is_valid_trip downstream rather than
      losing rows here.
    columns:
      - name: trip_id
        data_tests: [unique, not_null]
      - name: pu_location_id
        data_tests:
          - relationships:
              to: ref('dim_zone')
              field: location_id
              config:
                severity: warn   # unknown-zone codes (264/265) are expected
      - name: taxi_type
        data_tests:
          - accepted_values: { values: ["yellow", "green"] }

  - name: agg_daily_zone
    description: Trip counts/revenue/fare/tip aggregated by pickup date, taxi type, and zone.

  - name: agg_hourly_demand
    description: Trip counts aggregated by pickup date, hour, taxi type, and zone. Feeds demand forecasting.
